# NAB reksa dana harian + return 5 tahun dari dataset publik risan/reksadana-id.
# Manual: Actions -> Sync NAB reksa dana -> Run workflow. Otomatis tiap hari 07:30 WIB (dataset itu update 06:00 WIB).
name: Sync NAB reksa dana

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-rd-nav
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bangun rd-nav.json
        run: node tools/build-rd-nav.mjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/rd-nav.json
          if git diff --staged --quiet; then echo "Tidak ada perubahan."; exit 0; fi
          git commit -m "chore(data): rd-nav"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break || sleep 5; done
