# All Market / Regular / Nego dari BEI, tiap jam selama jam bursa (Senin–Jumat 09:05–16:05 WIB).
# Ringan: hanya menjalankan tools/build-market-activity.mjs dan meng-commit assets/data/market-activity.json
# (file ini dibaca dengan cache: no-store, jadi tidak perlu bump versi aset). Bisa juga manual.
# CATATAN: BEI mungkin hanya mengisi data akhir hari; field asOf + "diambil HH.MM WIB" di kartu beranda menunjukkan
# apa yang sebenarnya diterima, jadi tidak ada angka yang disamarkan sebagai live.

name: Market activity (jam bursa)

on:
  schedule:
    # 02:05–09:05 UTC = 09:05–16:05 WIB, tiap jam, Senin–Jumat
    - cron: '5 2-9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market-sync
  cancel-in-progress: false

jobs:
  activity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Playwright
        run: npm i --no-save playwright >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Build market-activity.json
        run: node tools/build-market-activity.mjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/market-activity.json
          if git diff --staged --quiet; then echo "Tidak ada perubahan."; exit 0; fi
          git commit -m "chore(data): market activity (jam bursa)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
