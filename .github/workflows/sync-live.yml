# Harga hampir-live tanpa Worker (cadangan untuk jaringan yang memblokir workers.dev).
# IHSG: Senin-Jumat 09:00-16:50 WIB tiap 10 menit. Saham AS: jam bursa (14:00-20:50 UTC) tiap 10 menit, di luar itu tiap jam
# (komoditas, indeks berjangka, dan harga penutupan tetap segar).
# Cron GitHub sering telat; manual: Actions -> Sync live -> Run workflow.
name: Sync live

on:
  schedule:
    - cron: '*/10 2-9 * * 1-5'
    - cron: '*/10 14-20 * * 1-5'
    - cron: '5 0-1,10-13,21-23 * * 1-5'
  # Cron GitHub untuk workflow ini terbukti tidak pernah jalan; 'Sync 24 jam' dipicu Worker tiap jam, jadi sambung ke situ.
  workflow_run:
    workflows: ['Sync 24 jam', 'Market activity (jam bursa)']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-live
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bangun harga live
        run: |
          if [ "${{ github.event.schedule }}" = "*/10 2-9 * * 1-5" ]; then
            node tools/build-live.mjs idx
            # jam pertama tiap jam: sekalian segarkan data global (jam bursa IHSG = AS tutup)
            if [ "$(date -u +%M)" -lt 15 ]; then node tools/build-live.mjs global; fi
          elif [ "${{ github.event.schedule }}" = "*/10 14-20 * * 1-5" ] || [ "${{ github.event.schedule }}" = "5 0-1,10-13,21-23 * * 1-5" ]; then node tools/build-live.mjs global
          else node tools/build-live.mjs idx; node tools/build-live.mjs global; fi
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/live-idx.json assets/data/live-global.json 2>/dev/null || true
          if git diff --staged --quiet; then echo "Tidak ada perubahan."; exit 0; fi
          git commit -m "chore(data): live"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break || sleep 5; done
