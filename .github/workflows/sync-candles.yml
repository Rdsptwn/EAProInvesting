# Candle statis (kripto, forex, saham AS, IHSG) untuk Tido/BoW: dilayani GitHub Pages, tidak lewat Worker/OKX yang bisa diblokir.
# Kripto/forex/saham AS tiap 2 jam, IHSG sekali sehari (hari kerja). Dibatasi supaya riwayat repo tidak membengkak. Manual: Actions -> Sync candles -> Run workflow.
name: Sync candles

on:
  schedule:
    - cron: '20 */2 * * *'
    - cron: '35 10 * * 1-5'
  # Cron GitHub untuk workflow ini terbukti tidak pernah jalan; sambung ke 'Sync 24 jam' (dipicu Worker tiap jam).
  workflow_run:
    workflows: ['Sync 24 jam']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-candles
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bangun candle
        run: |
          if [ "${{ github.event.schedule }}" = "35 10 * * 1-5" ]; then node tools/build-candles.mjs idx
          elif [ "${{ github.event_name }}" = "schedule" ]; then node tools/build-candles.mjs crypto forex global
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            # dipicu tiap jam: kripto/forex/AS tiap 2 jam (jam UTC genap), IHSG harian sekali setelah bursa tutup (17 WIB, Senin-Jumat)
            H=$(date -u +%H); D=$(date -u +%u)
            if [ $((10#$H % 2)) -eq 0 ]; then node tools/build-candles.mjs crypto forex global; fi
            if [ "$H" = "10" ] && [ "$D" -le 5 ]; then node tools/build-candles.mjs idx; fi
          else node tools/build-candles.mjs; fi
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/candles
          if git diff --staged --quiet; then echo "Tidak ada perubahan."; exit 0; fi
          git commit -m "chore(data): candles"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break || sleep 5; done
