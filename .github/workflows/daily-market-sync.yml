# Sinkron harian IHSG, harga emiten, kalender korporasi, dan pasar global.
# Jalan Senin–Jumat 09:00, 13:00, dan 17:00 WIB. Bisa juga manual:
# Actions → Daily market sync → Run workflow

name: Daily market sync

on:
  schedule:
    # 02:00 UTC = 09:00 WIB (buka sesi 1), Senin–Jumat
    - cron: '0 2 * * 1-5'
    # 06:00 UTC = 13:00 WIB (jelang sesi 2), Senin–Jumat
    - cron: '0 6 * * 1-5'
    # 10:00 UTC = 17:00 WIB (setelah tutup), Senin–Jumat
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Skrip snapshot tetap menulis file walau Yahoo gagal (IHSG null / quotes kosong).
      # Simpan cadangan, lalu kembalikan kalau hasilnya tidak layak.
      - name: Build market-snapshot.json
        continue-on-error: true
        run: |
          cp assets/data/market-snapshot.json /tmp/market-snapshot.bak
          node tools/build-market-snapshot.mjs
          node -e '
            const s = JSON.parse(require("fs").readFileSync("assets/data/market-snapshot.json", "utf8"));
            const ok = s.ihsg && Number.isFinite(s.ihsg.price) && s.meta.tickerCount >= 100;
            if (!ok) { console.error("Snapshot tidak valid: ihsg=" + JSON.stringify(s.ihsg) + " tickerCount=" + s.meta.tickerCount); process.exit(1); }
          ' || { echo "::warning::Snapshot gagal/tidak valid — pakai versi sebelumnya"; cp /tmp/market-snapshot.bak assets/data/market-snapshot.json; exit 1; }

      # Daftar SEMUA emiten BEI + harga semuanya (Market Screener). Gagal = data lama dipertahankan.
      - name: Build idx-universe.json + idx-screener.json (semua emiten BEI)
        continue-on-error: true
        run: |
          cp assets/data/idx-universe.json /tmp/idx-universe.bak
          cp assets/data/idx-screener.json /tmp/idx-screener.bak 2>/dev/null || true
          node tools/build-idx-universe.mjs || { echo "::warning::universe gagal — pakai daftar lama"; cp /tmp/idx-universe.bak assets/data/idx-universe.json; }
          node tools/build-idx-screener.mjs \
            && node -e 'const s=JSON.parse(require("fs").readFileSync("assets/data/idx-screener.json","utf8")); if(!(s.rows.length>=300)) process.exit(1)' \
            || { echo "::warning::idx-screener gagal/tidak valid — pakai versi sebelumnya"; [ -f /tmp/idx-screener.bak ] && cp /tmp/idx-screener.bak assets/data/idx-screener.json || rm -f assets/data/idx-screener.json; }

      - name: Build corporate-calendar.json
        continue-on-error: true
        run: |
          cp assets/data/corporate-calendar.json /tmp/corporate-calendar.bak
          node tools/build-corporate-calendar.mjs
          node -e 'JSON.parse(require("fs").readFileSync("assets/data/corporate-calendar.json", "utf8"))' \
            || { echo "::warning::Kalender rusak — pakai versi sebelumnya"; cp /tmp/corporate-calendar.bak assets/data/corporate-calendar.json; exit 1; }

      # Inflasi YoY & yield SBN 10 tahun (beranda). Gagal = nilai lama dipertahankan.
      - name: Build macro.json (inflasi & SBN 10Y)
        continue-on-error: true
        run: |
          cp assets/data/macro.json /tmp/macro.bak
          node tools/build-macro.mjs \
            && node -e 'const m=JSON.parse(require("fs").readFileSync("assets/data/macro.json","utf8")); if(!(m.inflation.value>-5&&m.sbn10y.value>2)) process.exit(1)' \
            || { echo "::warning::macro gagal/tidak valid — pakai versi sebelumnya"; cp /tmp/macro.bak assets/data/macro.json; }

      # CAGR + return per tahun ETF Pasar Global dari harga penutupan bulanan.
      # Skrip keluar tanpa menulis apa pun kalau semua permintaan gagal; angka lama dipertahankan.
      - name: Build pasar-global.json (CAGR dari Stooq)
        continue-on-error: true
        run: |
          cp assets/data/pasar-global.json /tmp/pasar-global.bak
          node tools/build-pasar-global.mjs \
            && node -e 'JSON.parse(require("fs").readFileSync("assets/data/pasar-global.json", "utf8"))' \
            || { echo "::warning::pasar-global gagal/tidak valid — pakai versi sebelumnya"; cp /tmp/pasar-global.bak assets/data/pasar-global.json; }

      - name: Bump cache version (hanya kalau data berubah)
        run: |
          if git diff --quiet -- assets/data; then
            echo "Data tidak berubah — skip bump cache."
          else
            node tools/bump-asset-version.mjs
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/market-snapshot.json assets/data/corporate-calendar.json assets/data/pasar-global.json assets/data/macro.json assets/data/idx-universe.json assets/js/ewoks-core.js
          [ -f assets/data/idx-screener.json ] && git add assets/data/idx-screener.json || true
          git add -u -- '*.html'
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data — skip commit."
            exit 0
          fi
          git commit -m "chore(data): daily market sync"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
