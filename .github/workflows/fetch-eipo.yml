# Sekali jalan (manual): ambil teks mentah e-ipo.co.id untuk melengkapi penjamin & harga IPO.
name: Fetch e-IPO raw
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/fetch-eipo-raw.mjs 420
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/raw/eipo-raw.json || true
          git diff --cached --quiet || (git commit -m "data: e-IPO raw" && git pull --rebase -q && git push)
