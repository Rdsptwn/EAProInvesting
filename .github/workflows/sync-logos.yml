# Petakan ticker -> domain situs resmi (logo) dari Yahoo. Manual: Actions -> Sync logo emiten -> Run workflow. Juga bulanan.
name: Sync logo emiten

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-logos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bangun pemetaan
        run: node tools/build-logos.mjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/logos-auto.json
          if git diff --staged --quiet; then echo "Tidak ada perubahan."; exit 0; fi
          git commit -m "chore(data): logos-auto"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break || sleep 5; done
